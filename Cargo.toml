[package]
name = "claude-status-bar"
version = "0.1.0"
edition = "2021"
description = "Claude Code status-line renderer"

[[bin]]
name = "claude-status-bar"
path = "src/main.rs"

[[bin]]
name = "status-bar-tools"
path = "src/bin/status-bar-tools.rs"

[dependencies]
chrono = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
